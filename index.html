<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="IMS566 InstaCommerce Store & Inventory Management Portal - Authentication" />
  <meta name="author" content="Aiman (2026130001)" />
  <title>Sign In | InstaCommerce Portal</title>
  <!-- Bootstrap 5 CSS & Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <link href="css/style.css" rel="stylesheet" />
</head>
<body>
  <main class="auth-wrapper">
    <div class="card auth-card bg-white p-4 p-md-5">
      <!-- Brand Header -->
      <div class="text-center mb-4">
        <div class="d-inline-flex align-items-center justify-content-center bg-primary text-white rounded-3 mb-3" style="width: 52px; height: 52px;">
          <i class="bi bi-bag-heart-fill fs-3"></i>
        </div>
        <h1 class="h4 fw-bold mb-1">InstaCommerce</h1>
        <p class="text-muted small mb-0">IMS566 Merchant &amp; Inventory Portal</p>
      </div>

      <!-- Feedback Alert Box -->
      <div id="authAlert" class="alert d-none" role="alert"></div>

      <!-- Login / Register Switch Tabs -->
      <ul class="nav nav-pills nav-fill bg-light p-1 rounded-3 mb-4" id="authTabs" role="tablist">
        <li class="nav-item" role="presentation">
          <button class="nav-link active fw-semibold" id="login-tab" data-bs-toggle="pill" data-bs-target="#login-pane" type="button" role="tab">
            Sign In
          </button>
        </li>
        <li class="nav-item" role="presentation">
          <button class="nav-link fw-semibold" id="register-tab" data-bs-toggle="pill" data-bs-target="#register-pane" type="button" role="tab">
            Register
          </button>
        </li>
      </ul>

      <div class="tab-content" id="authTabsContent">
        <!-- LOGIN PANE -->
        <div class="tab-pane fade show active" id="login-pane" role="tabpanel">
          <form id="loginForm" novalidate>
            <div class="mb-3">
              <label for="loginUsername" class="form-label small fw-semibold">Username</label>
              <div class="input-group">
                <span class="input-group-text bg-light"><i class="bi bi-person"></i></span>
                <input type="text" class="form-control" id="loginUsername" placeholder="Enter username (e.g., admin)" required />
              </div>
            </div>
            <div class="mb-3">
              <label for="loginPassword" class="form-label small fw-semibold">Password</label>
              <div class="input-group">
                <span class="input-group-text bg-light"><i class="bi bi-lock"></i></span>
                <input type="password" class="form-control" id="loginPassword" placeholder="Enter password" required />
              </div>
            </div>
            <div class="d-grid mb-3">
              <button type="submit" class="btn btn-primary fw-semibold py-2">
                <i class="bi bi-box-arrow-in-right me-1"></i> Access Store Dashboard
              </button>
            </div>
            <div class="bg-light border rounded-3 p-2 text-center small">
              <span class="text-muted">Demo:</span> <code>admin</code> / <code>password123</code>
              <button type="button" id="fillDemoBtn" class="btn btn-link btn-sm p-0 ms-2 text-decoration-none fw-semibold">
                Auto-fill
              </button>
            </div>
          </form>
        </div>

        <!-- REGISTER PANE -->
        <div class="tab-pane fade" id="register-pane" role="tabpanel">
          <form id="registerForm" novalidate>
            <div class="mb-3">
              <label for="regName" class="form-label small fw-semibold">Full Name</label>
              <input type="text" class="form-control" id="regName" placeholder="e.g., Aiman" required />
            </div>
            <div class="mb-3">
              <label for="regUsername" class="form-label small fw-semibold">Choose Username</label>
              <input type="text" class="form-control" id="regUsername" placeholder="Minimum 3 characters" required />
            </div>
            <div class="mb-3">
              <label for="regPassword" class="form-label small fw-semibold">Create Password</label>
              <input type="password" class="form-control" id="regPassword" placeholder="Minimum 6 characters" required />
            </div>
            <div class="d-grid">
              <button type="submit" class="btn btn-dark fw-semibold py-2">
                <i class="bi bi-person-plus me-1"></i> Create Staff Account
              </button>
            </div>
          </form>
        </div>
      </div>

      <div class="text-center mt-4 pt-3 border-top">
        <small class="text-muted">Universiti Teknologi MARA (UiTM) &bull; IMS566 Individual Project</small>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
